# nginx config for the Astro SCO static build.
# - Serves /usr/share/nginx/html as root.
# - Hashed assets under /_astro/ are immutable, 1y cache.
# - HTML responses are never cached.
# - Falls back to /404.html for unknown paths.
# - Gzip text assets.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/security-headers.conf;

    # Hashed Astro/Vite assets: cache forever
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Public assets (images, logos, sitemap, robots)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ $uri.html /404.html;
    }

    # sitemap / robots: short cache so changes propagate quickly
    location ~* /(sitemap.*\.xml|robots\.txt|rss\.xml|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=300" always;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf;

    # Security: block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
